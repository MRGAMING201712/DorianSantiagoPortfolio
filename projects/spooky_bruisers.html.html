            */
            class Box 
		{
		  constructor() 
		  {
			this.VertCount = 0;
			this.IsFinished = false;
			this.Positions = [];
			this.positionBuffer = gl.createBuffer();
			gl.bindBuffer(gl.ARRAY_BUFFER, this.positionBuffer);
			gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(this.Positions), gl.STATIC_DRAW);
		  }

		  addPoint(x, y) {
			if (this.VertCount == 0) 
			{
			  this.Positions.push(x, y, 0, 0, 1, 0);
			  this.VertCount = 1;
			} 
			else 
			{
			  var x1 = this.Positions[0];
			  var y1 = this.Positions[1];
			  var x2 = x;
			  var y2 = y;

			  // Triangle 1: Top-Left, Top-Right, Bottom-Left
			  // Triangle 2: Bottom-Left, Top-Right, Bottom-Right
			  this.Positions = 
			  [
				x1, y1, 0, 0, 1, 0,  x2, y1, 0, 0, 1, 0,  x1, y2, 0, 0, 1, 0,
				x1, y2, 0, 0, 1, 0,  x2, y1, 0, 0, 1, 0,  x2, y2, 0, 0, 1, 0
			  ];

			  this.VertCount = 6;
			  this.IsFinished = true;

			  gl.bindBuffer(gl.ARRAY_BUFFER, this.positionBuffer);
			  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(this.Positions), gl.STATIC_DRAW);
			}
		  }

		  addPointTemp(x, y) 
		  {
			if (this.VertCount == 1) 
			{
			  var x1 = this.Positions[0];
			  var y1 = this.Positions[1];
			  var x2 = x;
			  var y2 = y;

			  var tempRemaining = 
			  [
				x2, y1, 0, 0, 1, 0,  x1, y2, 0, 0, 1, 0, // Finish Tri 1
				x1, y2, 0, 0, 1, 0,  x2, y1, 0, 0, 1, 0,  x2, y2, 0, 0, 1, 0  // Tri 2
			  ];

			  for (let val of tempRemaining) 
			  {
			  this.Positions.push(val); 
			  }
			  this.VertCount = 6;

			  gl.bindBuffer(gl.ARRAY_BUFFER, this.positionBuffer);
			  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(this.Positions), gl.STATIC_DRAW);

			  m.renderAll();

			  for (let i = 0; i < 30; i++) { this.Positions.pop(); }
			  this.VertCount = 1;

			  gl.bindBuffer(gl.ARRAY_BUFFER, this.positionBuffer);
			  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(this.Positions), gl.STATIC_DRAW);
			}
		  }

		  render(program) 
		  {
			if (this.VertCount < 6) 
			{
				return;
			}

			var positionAttributeLocation = gl.getAttribLocation(program, "a_position");
			gl.enableVertexAttribArray(positionAttributeLocation);

			var colorAttributeLocation = gl.getAttribLocation(program, "a_color");
			gl.enableVertexAttribArray(colorAttributeLocation);

			gl.bindBuffer(gl.ARRAY_BUFFER, this.positionBuffer);

			gl.vertexAttribPointer(positionAttributeLocation, 3, gl.FLOAT, false, 6 * 4, 0);
			gl.vertexAttribPointer(colorAttributeLocation, 3, gl.FLOAT, false, 6 * 4, 3 * 4);

			gl.drawArrays(gl.TRIANGLES, 0, this.VertCount);
		  }
